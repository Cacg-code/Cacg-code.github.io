<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-label="Precios en soles, referenciales y sin IGV. Empiezas con el 50 % y el resto al entregar. Piloto gratis para 3 negocios."><style>.t{font-family:Segoe UI,Helvetica,Arial,sans-serif}
.fl{animation:fl 5s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.ck{opacity:0;animation:ck 7s infinite}@keyframes ck{0%{opacity:0;transform:translateX(-10px)}8%,88%{opacity:1;transform:translateX(0)}96%,100%{opacity:0}}
.sh{animation:sh 3.6s linear infinite}@keyframes sh{0%{transform:translateX(-340px) skewX(-20deg)}100%{transform:translateX(420px) skewX(-20deg)}}
.pr{animation:pr 3s ease-in-out infinite}@keyframes pr{0%,100%{opacity:.85}50%{opacity:1}}
.bd{stroke-dasharray:10 8;animation:bd 2s linear infinite}@keyframes bd{to{stroke-dashoffset:-18}}
.pu{transform-box:fill-box;transform-origin:center;animation:pu 1.8s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(-8deg)}}</style><rect width="1000" height="190" rx="22" fill="#0e1020"/>
