<g class="ck" style="animation-delay:0.15s"><circle cx="34" cy="212" r="10" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa"/><text x="34" y="216.5" text-anchor="middle" font-size="12" font-weight="800" fill="#a78bfa">✓</text><text x="56" y="217" font-size="14" fill="#e0e7ff">4–5 secciones o catálogo con carrito</text></g>
<g class="ck" style="animation-delay:0.40s"><circle cx="34" cy="248" r="10" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa"/><text x="34" y="252.5" text-anchor="middle" font-size="12" font-weight="800" fill="#a78bfa">✓</text><text x="56" y="253" font-size="14" fill="#e0e7ff">Pedido directo a tu WhatsApp</text></g>
