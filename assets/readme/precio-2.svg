<svg xmlns="http://www.w3.org/2000/svg" width="340" height="430" viewBox="0 0 340 430" role="img" aria-label="Paquete Profesional: desde S/ 1,100. Web completa o catálogo con pedido por WhatsApp. 4–5 secciones o catálogo con carrito. Pedido directo a tu WhatsApp. Diseño a tu marca. 1 mes de soporte"><style>.t{font-family:Segoe UI,Helvetica,Arial,sans-serif}
.fl{animation:fl 5s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
