.sh{animation:sh 3.6s linear infinite}@keyframes sh{0%{transform:translateX(-340px) skewX(-20deg)}100%{transform:translateX(420px) skewX(-20deg)}}
.pr{animation:pr 3s ease-in-out infinite}@keyframes pr{0%,100%{opacity:.85}50%{opacity:1}}
.bd{stroke-dasharray:10 8;animation:bd 2s linear infinite}@keyframes bd{to{stroke-dashoffset:-18}}
.pu{transform-box:fill-box;transform-origin:center;animation:pu 1.8s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(-8deg)}}</style>
