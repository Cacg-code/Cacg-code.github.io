<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Carlo · Dev — Desarrollo web Full Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07070D"/><stop offset="1" stop-color="#14122B"/></linearGradient>
    <linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="0.55" stop-color="#F472B6"/><stop offset="1" stop-color="#5EEAD4"/></linearGradient>
    <radialGradient id="o1"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".55"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="o2"><stop offset="0" stop-color="#F472B6" stop-opacity=".4"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></radialGradient>
    <radialGradient id="o3"><stop offset="0" stop-color="#5EEAD4" stop-opacity=".35"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .f{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .o1{animation:m1 9s ease-in-out infinite}.o2{animation:m2 11s ease-in-out infinite}.o3{animation:m3 13s ease-in-out infinite}
    @keyframes m1{0%,100%{transform:translate(0,0)}50%{transform:translate(90px,30px)}}
    @keyframes m2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,-25px)}}
    @keyframes m3{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-40px)}}
    .cur{animation:b 1s steps(2) infinite}@keyframes b{50%{opacity:0}}
    .up{opacity:0;animation:u .9s ease-out forwards}
    @keyframes u{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .d1{animation-delay:.2s}.d2{animation-delay:.5s}.d3{animation-delay:.8s}
    .chip{opacity:0;animation:u .7s ease-out forwards}
    .fl{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  </style>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <circle class="o1" cx="180" cy="90" r="260" fill="url(#o1)"/>
  <circle class="o2" cx="1020" cy="330" r="240" fill="url(#o2)"/>
  <circle class="o3" cx="640" cy="40" r="200" fill="url(#o3)"/>
  <g stroke="#ffffff" stroke-opacity=".05"><path d="M0 100H1200M0 200H1200M0 300H1200M300 0V400M600 0V400M900 0V400"/></g>

  <g class="fl" transform="translate(900 70)">
    <rect width="230" height="150" rx="14" fill="#0D0D17" stroke="#ffffff2e"/>
    <circle cx="18" cy="18" r="5" fill="#F472B6"/><circle cx="36" cy="18" r="5" fill="#FBBF24"/><circle cx="54" cy="18" r="5" fill="#5EEAD4"/>
    <text class="f" x="20" y="62" font-size="15" fill="#A78BFA" font-family="Consolas,monospace">const carlo = {</text>
    <text class="f" x="38" y="86" font-size="15" fill="#F4F4FA" font-family="Consolas,monospace">rol: <tspan fill="#5EEAD4">"Full Stack"</tspan>,</text>
    <text class="f" x="38" y="110" font-size="15" fill="#F4F4FA" font-family="Consolas,monospace">ciudad: <tspan fill="#5EEAD4">"Lima"</tspan></text>
    <text class="f" x="20" y="134" font-size="15" fill="#A78BFA" font-family="Consolas,monospace">}<tspan class="cur" fill="#F472B6">▌</tspan></text>
  </g>

  <text class="f up d1" x="70" y="130" font-size="22" font-weight="600" fill="#9A9AB5" letter-spacing="4">HOLA, SOY</text>
  <text class="f up d2" x="68" y="215" font-size="88" font-weight="800" fill="url(#tx)">Carlo · Dev</text>
  <text class="f up d3" x="70" y="265" font-size="28" fill="#F4F4FA">Desarrollo web Full Stack para negocios reales</text>

  <g class="f" font-size="16" font-weight="600" text-anchor="middle">
    <g class="chip" style="animation-delay:1.1s"><rect x="70" y="300" width="96" height="36" rx="18" fill="#ffffff10" stroke="#ffffff2e"/><text x="118" y="324" fill="#F4F4FA">React</text></g>
    <g class="chip" style="animation-delay:1.25s"><rect x="178" y="300" width="130" height="36" rx="18" fill="#ffffff10" stroke="#ffffff2e"/><text x="243" y="324" fill="#F4F4FA">JavaScript</text></g>
    <g class="chip" style="animation-delay:1.4s"><rect x="320" y="300" width="106" height="36" rx="18" fill="#ffffff10" stroke="#ffffff2e"/><text x="373" y="324" fill="#F4F4FA">Node.js</text></g>
    <g class="chip" style="animation-delay:1.55s"><rect x="438" y="300" width="128" height="36" rx="18" fill="#ffffff10" stroke="#ffffff2e"/><text x="502" y="324" fill="#F4F4FA">HTML · CSS</text></g>
    <g class="chip" style="animation-delay:1.7s"><rect x="578" y="300" width="146" height="36" rx="18" fill="#ffffff10" stroke="#ffffff2e"/><text x="651" y="324" fill="#F4F4FA">Lima, Perú</text></g>
  </g>
</svg>
